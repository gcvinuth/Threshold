<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Threshold - Routine & Task Manager</title>
<meta name="description" content="A day-of task and routine manager organized around the doors you walk through." />
<meta name="theme-color" content="#1a1512" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ---------- Color Palette & Tokens (Brown, Sage Green, Peach/White) ---------- */
:root {
  --bg: #1c1714;
  --bg-elev: #241e1a;
  --card: #2a231f;
  --card-2: #332b26;
  --border: rgba(232, 214, 196, 0.12);
  --border-soft: rgba(232, 214, 196, 0.07);
  
  --ink: #f9f5f0;
  --ink-dim: #c5b9ac;
  --ink-faint: #8a7c6f;
  
  --sage: #8b9a7d;
  --sage-dark: #6e7d60;
  --sage-ink: #141a10;
  --sage-glow: rgba(139, 154, 125, 0.18);
  
  --peach: #e3a982;
  --peach-ink: #1f140d;
  --peach-glow: rgba(227, 169, 130, 0.15);
  
  --amber: #d99355;
  --amber-ink: #1a1109;
  
  --danger: #d9786c;
  
  --radius-lg: 22px;
  --radius-md: 14px;
  --radius-sm: 10px;
  
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  
  --shadow: 0 12px 36px rgba(0,0,0,0.45);
  --dur: 220ms;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }

body {
  background: radial-gradient(1200px 700px at 50% -10%, #2e2520 0%, var(--bg) 60%);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  transition: background var(--dur) var(--ease);
  overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}

body.leaving-mode {
  background: radial-gradient(1200px 700px at 50% -10%, #3a2214 0%, #1c120c 60%);
}

a { color: inherit; text-decoration: none; }
button, input, select { font-family: inherit; }
::selection { background: var(--sage); color: var(--sage-ink); }

/* ---------- Top Navigation (Desktop & Mobile Header) ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px clamp(16px, 4vw, 40px);
  max-width: 1100px;
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--peach);
}
.brand-mark { width: 22px; height: 22px; }
.brand-name { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: 0.01em; color: var(--ink); }

/* Top tabs for desktop */
.tabs-desktop {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  padding: 4px;
}
.tabs-desktop a {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-dim);
  padding: 8px 16px;
  border-radius: 999px;
  transition: all var(--dur) var(--ease);
}
.tabs-desktop a:hover { color: var(--ink); }
.tabs-desktop a.active { background: var(--sage); color: var(--sage-ink); font-weight: 600; }
body.leaving-mode .tabs-desktop a.active { background: var(--peach); color: var(--peach-ink); }
.tab-ico { width: 16px; height: 16px; flex-shrink: 0; }

/* Bottom navigation for mobile */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(36, 30, 26, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-soft);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  z-index: 40;
  justify-content: space-around;
}

.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-faint);
  padding: 6px 12px;
  border-radius: 12px;
  transition: color var(--dur) var(--ease);
}
.bottom-nav a.active { color: var(--sage); }
body.leaving-mode .bottom-nav a.active { color: var(--peach); }
.bottom-nav .tab-ico { width: 20px; height: 20px; }

@media (max-width: 720px) {
  .tabs-desktop { display: none; }
  .bottom-nav { display: flex; }
  .app { padding-bottom: 110px !important; }
}

/* ---------- App Layout ---------- */
.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 8px clamp(16px, 4vw, 40px) 100px;
  min-height: 65vh;
}

.eyebrow {
  font-size: 11.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sage);
  font-weight: 700;
  margin: 16px 0 6px;
}
body.leaving-mode .eyebrow { color: var(--peach); }

.page-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 4vw, 38px);
  margin: 0 0 8px;
}
.page-sub {
  color: var(--ink-dim);
  font-size: 14.5px;
  max-width: 620px;
  line-height: 1.5;
  margin: 0 0 24px;
}

/* ---------- Today View ---------- */
.today-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin: 12px 0 20px;
}
.today-date {
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 700;
}
.today-greet {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(28px, 4.5vw, 38px);
  margin-top: 4px;
}
.today-clock {
  font-family: var(--serif);
  font-size: 26px;
  color: var(--ink-dim);
  font-variant-numeric: tabular-nums;
}

/* ---------- Location Card ---------- */
.loc-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  margin-bottom: 22px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  transition: all var(--dur) var(--ease);
}
body.leaving-mode .loc-card {
  background: linear-gradient(180deg, var(--peach-glow), transparent 70%), var(--card);
  border-color: rgba(227, 169, 130, 0.35);
}

.loc-left { display: flex; align-items: center; gap: 14px; }
.loc-icon {
  width: 46px; height: 46px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  background: var(--sage-glow);
  color: var(--sage);
  flex-shrink: 0;
}
body.leaving-mode .loc-icon { background: var(--peach-glow); color: var(--peach); }
.loc-icon svg { width: 22px; height: 22px; }

.loc-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
  font-weight: 700;
}
.loc-name { font-family: var(--serif); font-size: 22px; margin-top: 2px; }
.loc-note { width: 100%; color: var(--ink-faint); font-size: 13.5px; margin-top: 2px; }

/* ---------- Buttons ---------- */
.btn {
  border: none;
  cursor: pointer;
  border-radius: 999px;
  font-weight: 600;
  font-size: 14px;
  padding: 11px 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.btn:active { transform: scale(0.96); }

.btn-primary { background: var(--sage); color: var(--sage-ink); }
.btn-primary:hover { opacity: 0.92; }
body.leaving-mode .btn-primary { background: var(--peach); color: var(--peach-ink); }

.btn-light { background: var(--ink); color: #1c1714; }
.btn-light:hover { opacity: 0.92; }

.btn-ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--ink); border-color: var(--sage); }

.btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(217,120,108,0.35); }
.btn-danger:hover { background: rgba(217,120,108,0.1); }

.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-block { width: 100%; }

.proximity-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--sage-glow); border: 1px dashed var(--sage); border-radius: var(--radius-md);
  padding: 12px 16px; margin-bottom: 18px; font-size: 13.5px; color: var(--ink);
}

/* ---------- Columns Layout (Do / Take / Give) ---------- */
.columns {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
@media (max-width: 900px) {
  .columns { grid-template-columns: 1fr; }
}

.col {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  min-height: 200px;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.col.col-hidden {
  display: none !important;
}

.col-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.col-title { font-family: var(--serif); font-size: 21px; font-weight: 600; }
.col-count { font-size: 12px; color: var(--ink-faint); font-weight: 600; }
.col-empty { color: var(--ink-faint); font-size: 13.5px; padding: 12px 2px 18px; }
.col-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }

.add-link {
  display: flex; align-items: center; gap: 7px; color: var(--sage); font-size: 13.5px; font-weight: 600;
  background: none; border: none; cursor: pointer; padding: 8px 2px; margin-top: 10px; align-self: flex-start;
}
body.leaving-mode .add-link { color: var(--peach); }
.add-link:hover { opacity: 0.8; }
.add-link svg { width: 15px; height: 15px; }

/* ---------- Item Cards ---------- */
.item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--card-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.item.completing { transform: scale(0.96); opacity: 0; }

.item-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1.8px solid var(--ink-faint);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--dur) var(--ease);
  color: var(--sage-ink);
}
.item-check:hover { border-color: var(--sage); background: rgba(139, 154, 125, 0.15); }
body.leaving-mode .item-check:hover { border-color: var(--peach); }
.item-check svg { width: 12px; height: 12px; opacity: 0; transition: opacity var(--dur); }

.item-body { flex: 1; min-width: 0; }
.item-title { margin: 0; font-size: 14.5px; font-weight: 500; line-height: 1.4; }
.item-meta { margin: 4px 0 0; font-size: 12px; color: var(--ink-faint); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.item-tag {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
  background: rgba(232, 214, 196, 0.08); color: var(--peach);
}
.item-menu {
  background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 18px; line-height: 1;
  padding: 2px 6px; border-radius: 6px; flex-shrink: 0;
}
.item-menu:hover { color: var(--ink); background: rgba(255,255,255,0.06); }

/* ---------- Vault (History) ---------- */
.search-box {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  padding: 12px 18px; margin-bottom: 16px;
}
.search-box svg { width: 16px; height: 16px; color: var(--ink-faint); flex-shrink: 0; }
.search-box input {
  background: none; border: none; outline: none; color: var(--ink); font-size: 14.5px; width: 100%;
}
.search-box input::placeholder { color: var(--ink-faint); }

.filter-row { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border); background: transparent; color: var(--ink-dim);
  border-radius: 999px; padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
  transition: all var(--dur) var(--ease);
}
.chip.active { background: var(--sage); color: var(--sage-ink); border-color: var(--sage); }

.empty-panel {
  border: 1px dashed var(--border); border-radius: var(--radius-lg);
  padding: 50px 20px; text-align: center; color: var(--ink-faint);
}
.empty-panel .empty-icon { width: 36px; height: 36px; margin: 0 auto 14px; opacity: 0.6; }

.vault-day { margin-bottom: 22px; }
.vault-day-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); font-weight: 700; margin-bottom: 10px; }
.vault-list { display: flex; flex-direction: column; gap: 8px; }
.vault-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
  padding: 12px 16px;
}
.vault-check {
  width: 20px; height: 20px; border-radius: 50%; background: var(--sage); color: var(--sage-ink);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.vault-check svg { width: 11px; height: 11px; }
.vault-row-title { font-size: 14px; font-weight: 500; }
.vault-row-meta { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
.vault-row-time { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

/* ---------- Places View ---------- */
.place-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px 20px; margin-bottom: 12px;
}
.place-left { display: flex; align-items: center; gap: 14px; }
.place-icon {
  width: 44px; height: 44px; border-radius: 12px; background: var(--sage-glow); color: var(--sage);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.place-icon svg { width: 20px; height: 20px; }
.place-name { font-family: var(--serif); font-size: 19px; font-weight: 500; }
.place-sub { font-size: 12.5px; color: var(--ink-faint); margin-top: 2px; }
.place-actions { display: flex; gap: 8px; }

/* ---------- Settings View ---------- */
.section-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 22px 24px; margin-bottom: 18px;
}
.section-title { font-family: var(--serif); font-size: 21px; margin: 0 0 6px; }
.section-sub { color: var(--ink-dim); font-size: 13.5px; line-height: 1.5; margin: 0 0 18px; }

.field-label { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; margin-bottom: 8px; }
.text-input, .time-input, .select-input {
  width: 100%; background: var(--bg-elev); border: 1px solid var(--border); color: var(--ink);
  border-radius: var(--radius-sm); padding: 12px 15px; font-size: 14.5px; outline: none;
  transition: border-color var(--dur);
}
.text-input:focus, .time-input:focus, .select-input:focus { border-color: var(--sage); }
.text-input::placeholder { color: var(--ink-faint); }
.field-hint { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; line-height: 1.5; }

.toggle-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 16px 0; border-bottom: 1px solid var(--border-soft);
}
.toggle-row:last-child { border-bottom: none; }
.toggle-copy strong { font-size: 14.5px; font-weight: 600; display: block; }
.toggle-copy span { font-size: 12.5px; color: var(--ink-faint); display: block; margin-top: 2px; max-width: 420px; }

.switch {
  position: relative; width: 44px; height: 26px; flex-shrink: 0; border-radius: 999px;
  background: rgba(255,255,255,0.12); border: none; cursor: pointer; transition: background var(--dur);
}
.switch::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: #d8ceca; transition: transform var(--dur) var(--ease);
}
.switch.on { background: var(--sage); }
.switch.on::after { transform: translateX(18px); background: var(--sage-ink); }

.footer-tag { text-align: center; color: var(--ink-faint); font-size: 12.5px; margin: 34px 0 20px; }

/* ---------- Quick Add FAB (Functional Floating Action Button) ---------- */
.fab {
  position: fixed;
  right: 22px;
  bottom: clamp(22px, 8vw, 84px);
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--sage);
  color: var(--sage-ink);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
  z-index: 35;
}
.fab svg { width: 24px; height: 24px; }
.fab:hover { transform: scale(1.06); }
.fab:active { transform: scale(0.94); }
body.leaving-mode .fab { background: var(--peach); color: var(--peach-ink); }

/* ---------- Bottom Sheet Modal ---------- */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(12, 10, 8, 0.72); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center; z-index: 60;
  animation: fadeIn var(--dur) var(--ease);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  width: 100%; max-width: 500px; background: var(--bg-elev); border: 1px solid var(--border);
  border-bottom: none; border-radius: 24px 24px 0 0; padding: 22px 22px calc(24px + env(safe-area-inset-bottom));
  animation: slideUp var(--dur) var(--ease); max-height: 88vh; overflow-y: auto;
}
@media (min-width: 640px) {
  .sheet-overlay { align-items: center; }
  .sheet { border-radius: var(--radius-lg); border-bottom: 1px solid var(--border); padding-bottom: 24px; }
}
@keyframes slideUp { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }

.sheet-title { font-family: var(--serif); font-size: 22px; margin: 0 0 18px; }
.sheet-row { margin-bottom: 16px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
.sheet-actions .btn { flex: 1; }

.seg { display: flex; gap: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 4px; }
.seg button {
  flex: 1; border: none; background: transparent; color: var(--ink-dim); padding: 9px 10px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all var(--dur);
}
.seg button.active { background: var(--sage); color: var(--sage-ink); }

.check-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
.check-row input { width: 18px; height: 18px; accent-color: var(--sage); }
.check-row label { font-size: 13.5px; color: var(--ink-dim); cursor: pointer; }

/* ---------- Toasts ---------- */
.toast-root {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 90;
  display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
}
.toast {
  background: var(--ink); color: #1c1714; padding: 11px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
  box-shadow: var(--shadow); animation: toastIn var(--dur) var(--ease);
}
@keyframes toastIn { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }

.stack { display: flex; flex-direction: column; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
</style>
</head>
<body>

<div id="toast-root" class="toast-root" aria-live="polite"></div>

<!-- Topbar Header -->
<header class="topbar">
  <a class="brand" href="#/" data-nav>
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 5 V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 5 V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M4 5 H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M2.5 19 H21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">Threshold</span>
  </a>

  <nav class="tabs-desktop" aria-label="Primary Desktop">
    <a href="#/" data-nav data-route="/"><svg class="tab-ico" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5V5M12 19v2.5M4.5 12H2M22 12h-2.5M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Today</a>
    <a href="#/history" data-nav data-route="/history"><svg class="tab-ico" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="7" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 7 5.5 3.5h13L20.5 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Vault</a>
    <a href="#/places" data-nav data-route="/places"><svg class="tab-ico" viewBox="0 0 24 24" fill="none"><path d="M12 21.5s7-6.4 7-12A7 7 0 0 0 5 9.5c0 5.6 7 12 7 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="9.4" r="2.3" stroke="currentColor" stroke-width="1.8"/></svg>Places</a>
    <a href="#/settings" data-nav data-route="/settings"><svg class="tab-ico" viewBox="0 0 24 24" fill="none"><path d="M4 7h11M18 7h2M4 12h7M14 12h6M4 17h13M20 17h0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17.5" cy="7" r="1.9" stroke="currentColor" stroke-width="1.8"/><circle cx="10.5" cy="12" r="1.9" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="17" r="1.9" stroke="currentColor" stroke-width="1.8"/></svg>More</a>
  </nav>
</header>

<!-- Main View Container -->
<main id="app" class="app"></main>

<!-- Mobile Bottom Navigation Bar -->
<nav class="bottom-nav" aria-label="Primary Mobile">
  <a href="#/" data-nav data-route="/"><svg class="tab-ico" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2.5V5M12 19v2.5M4.5 12H2M22 12h-2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Today</a>
  <a href="#/history" data-nav data-route="/history"><svg class="tab-ico" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="7" width="17" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3.5 7 5.5 3.5h13L20.5 7" stroke="currentColor" stroke-width="2"/></svg>Vault</a>
  <a href="#/places" data-nav data-route="/places"><svg class="tab-ico" viewBox="0 0 24 24" fill="none"><path d="M12 21.5s7-6.4 7-12A7 7 0 0 0 5 9.5c0 5.6 7 12 7 12Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.4" r="2.2" stroke="currentColor" stroke-width="2"/></svg>Places</a>
  <a href="#/settings" data-nav data-route="/settings"><svg class="tab-ico" viewBox="0 0 24 24" fill="none"><path d="M4 7h11M18 7h2M4 12h7M14 12h6M4 17h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17.5" cy="7" r="1.9" stroke="currentColor" stroke-width="2"/><circle cx="10.5" cy="12" r="1.9" stroke="currentColor" stroke-width="2"/></svg>More</a>
</nav>

<!-- Functional Quick Add FAB Button -->
<button id="fab" class="fab" aria-label="Quick Add Item">
  <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
</button>

<!-- Bottom Sheet Root -->
<div id="sheet-root"></div>

<script>
/* =========================================================================
   Threshold — Complete Logic (Single File Application)
   ========================================================================= */

// Global string escaping helper - defined early to prevent reference errors
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

(() => {
  'use strict';

  const STORE_KEY = 'threshold:v1';

  const ICONS = {
    home: 'M4 11 12 4l8 7M6 10v9h4v-5h4v5h4v-9',
    office: 'M6 21V6l6-3 6 3v15M9 21v-4h6v4M9 11h.01M9 8h.01M15 11h.01M15 8h.01',
    gym: 'M4 12h2M18 12h2M6 9v6M18 9v6M8 12h8M6 12v0',
    school: 'M12 4 2 9l10 5 10-5-10-5ZM2 9v6M6 12.5V17c0 1.5 3 3 6 3s6-1.5 6-3v-4.5',
    other: 'M12 21.5s7-6.4 7-12A7 7 0 0 0 5 9.5c0 5.6 7 12 7 12Z',
  };
  const ICON_LABELS = { home: 'Home', office: 'Office', gym: 'Gym', school: 'School', other: 'Place' };

  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const PLUS_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

  /* ---------------- State Management ---------------- */

  function defaultState() {
    return {
      places: [
        { id: uid(), name: 'Home', icon: 'home', lat: null, lng: null, isCurrent: true },
      ],
      items: [],
      vault: [],
      leavingPlaceId: null,
      settings: {
        name: '',
        permLocation: false,
        permReminders: false,
        permHaptics: true,
        pingTime: '08:15',
        lastActiveDate: todayStr(),
        lastPingFiredDate: null,
      },
    };
  }

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const base = defaultState();
      return {
        ...base,
        ...parsed,
        settings: { ...base.settings, ...(parsed.settings || {}) },
      };
    } catch (e) {
      console.warn('Threshold: State load fallback.', e);
      return defaultState();
    }
  }

  function saveState() {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function todayStr(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function currentPlace() {
    return state.places.find((p) => p.isCurrent) || state.places[0] || null;
  }

  function placeById(id) {
    return state.places.find((p) => p.id === id) || null;
  }

  /* ---------------- Daily Reset ---------------- */

  function ensureDailyReset() {
    const today = todayStr();
    if (state.settings.lastActiveDate === today) return;
    state.items = state.items
      .filter((i) => i.recurring)
      .map((i) => ({ ...i, done: false }));
    state.leavingPlaceId = null;
    state.settings.lastActiveDate = today;
    state.settings.lastPingFiredDate = null;
    saveState();
  }

  /* ---------------- Items Logic ---------------- */

  function addItem({ type, title, time, placeId, recurring }) {
    if (!title || !title.trim()) return;
    state.items.push({
      id: uid(),
      type: type || 'do',
      title: title.trim(),
      time: time || null,
      placeId: placeId || null,
      recurring: !!recurring,
      done: false,
    });
    saveState();
  }

  function updateItem(id, patch) {
    const it = state.items.find((i) => i.id === id);
    if (!it) return;
    Object.assign(it, patch);
    saveState();
  }

  function completeItem(id) {
    const idx = state.items.findIndex((i) => i.id === id);
    if (idx === -1) return;
    const it = state.items[idx];
    state.vault.unshift({
      id: uid(),
      type: it.type,
      title: it.title,
      place: it.placeId ? (placeById(it.placeId)?.name || null) : null,
      timestamp: Date.now(),
    });
    if (it.recurring) {
      it.done = true;
    } else {
      state.items.splice(idx, 1);
    }
    saveState();
    doHaptic();
  }

  function deleteItem(id) {
    state.items = state.items.filter((i) => i.id !== id);
    saveState();
  }

  /* ---------------- Places Logic ---------------- */

  function addPlace({ name, icon, lat, lng }) {
    if (!name || !name.trim()) return null;
    const p = { id: uid(), name: name.trim(), icon: icon || 'other', lat: lat ?? null, lng: lng ?? null, isCurrent: state.places.length === 0 };
    state.places.push(p);
    saveState();
    return p;
  }

  function updatePlace(id, patch) {
    const p = placeById(id);
    if (!p) return;
    Object.assign(p, patch);
    saveState();
  }

  function deletePlace(id) {
    const wasCurrent = placeById(id)?.isCurrent;
    state.places = state.places.filter((p) => p.id !== id);
    state.items.forEach((i) => { if (i.placeId === id) i.placeId = null; });
    if (state.leavingPlaceId === id) state.leavingPlaceId = null;
    if (wasCurrent && state.places[0]) state.places[0].isCurrent = true;
    saveState();
  }

  function setCurrentPlace(id) {
    state.places.forEach((p) => { p.isCurrent = p.id === id; });
    if (state.leavingPlaceId && state.leavingPlaceId !== id) state.leavingPlaceId = null;
    saveState();
  }

  /* ---------------- Leaving Mode ---------------- */

  function toggleLeaving() {
    const cp = currentPlace();
    if (!cp) return;
    state.leavingPlaceId = state.leavingPlaceId === cp.id ? null : cp.id;
    saveState();
    applyLeavingClass();
    render();
  }

  function applyLeavingClass() {
    document.body.classList.toggle('leaving-mode', !!state.leavingPlaceId);
  }

  /* ---------------- Feedback & Helpers ---------------- */

  function doHaptic() {
    if (state.settings.permHaptics && 'vibrate' in navigator) {
      try { navigator.vibrate(35); } catch (e) { /* silent */ }
    }
  }

  function toast(msg) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(-6px)'; }, 2200);
    setTimeout(() => el.remove(), 2500);
  }

  function formatClock(d) {
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, '0');
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return `${h}:${m} ${ap}`;
  }

  function formatTime12(hhmm) {
    if (!hhmm) return '';
    const [h, m] = hhmm.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    return formatClock(d);
  }

  function greeting(d) {
    const h = d.getHours();
    if (h < 5) return 'Still up';
    if (h < 12) return 'Good morning';
    if (h < 17) return 'Good afternoon';
    if (h < 21) return 'Good evening';
    return 'Winding down';
  }

  function dateHeading(d) {
    return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
  }

  function iconSvg(name, cls) {
    const d = ICONS[name] || ICONS.other;
    return `<svg class="${cls || ''}" viewBox="0 0 24 24" fill="none"><path d="${d}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function vaultDayLabel(ts) {
    const d = new Date(ts);
    const today = todayStr();
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (todayStr(d) === today) return 'Today';
    if (todayStr(d) === todayStr(y)) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  }

  /* ---------------- Router & Navigation ---------------- */

  function currentRoute() {
    const h = location.hash.replace(/^#/, '');
    return h || '/';
  }

  function navigate(route) {
    location.hash = route === '/' ? '/' : route;
  }

  window.addEventListener('hashchange', render);

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-nav]');
    if (a) closeSheet();
  });

  /* ---------------- Bottom Sheet Component ---------------- */

  function openSheet(html, onMount) {
    closeSheet();
    const root = document.getElementById('sheet-root');
    const overlay = document.createElement('div');
    overlay.className = 'sheet-overlay';
    overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });
    root.appendChild(overlay);
    document.addEventListener('keydown', escCloseHandler);
    if (onMount) onMount(overlay);
  }

  function escCloseHandler(e) {
    if (e.key === 'Escape') closeSheet();
  }

  function closeSheet() {
    const root = document.getElementById('sheet-root');
    root.innerHTML = '';
    document.removeEventListener('keydown', escCloseHandler);
  }

  /* ---------------- Quick Add FAB Handler ---------------- */

  function openQuickAddSheet(defaultType = 'do') {
    let activeType = defaultType;
    openSheet(`
      <h3 class="sheet-title">Quick Add Item</h3>
      <div class="sheet-row">
        <div class="field-label">Type</div>
        <div class="seg" id="quick-add-type">
          <button type="button" data-t="do" class="${activeType === 'do' ? 'active' : ''}">Do</button>
          <button type="button" data-t="take" class="${activeType === 'take' ? 'active' : ''}">Take</button>
          <button type="button" data-t="give" class="${activeType === 'give' ? 'active' : ''}">Give</button>
        </div>
      </div>
      <div class="sheet-row">
        <div class="field-label">Task or Item</div>
        <input class="text-input" id="f-title" placeholder="e.g. Bring water bottle" autofocus />
      </div>
      <div class="sheet-row">
        <div class="field-label">Time (optional)</div>
        <input class="time-input" id="f-time" type="time" />
      </div>
      <div class="sheet-row" id="f-place-wrap" style="${activeType === 'do' ? 'display:none;' : ''}">
        <div class="field-label">Associated Place</div>
        <select class="select-input" id="f-place">
          ${state.places.map((p) => `<option value="${p.id}" ${p.isCurrent ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
        </select>
      </div>
      <div class="sheet-row check-row">
        <input type="checkbox" id="f-recurring" />
        <label for="f-recurring">Daily routine (resets each morning)</label>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" data-x="cancel">Cancel</button>
        <button class="btn btn-primary" data-x="save">Save Item</button>
      </div>
    `, (root) => {
      const typeSeg = root.querySelector('#quick-add-type');
      const placeWrap = root.querySelector('#f-place-wrap');
      const titleInput = root.querySelector('#f-title');
      
      setTimeout(() => titleInput.focus(), 80);

      typeSeg.querySelectorAll('button').forEach((b) => {
        b.addEventListener('click', () => {
          activeType = b.dataset.t;
          typeSeg.querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
          placeWrap.style.display = activeType === 'do' ? 'none' : 'block';
        });
      });

      root.querySelector('[data-x="cancel"]').addEventListener('click', closeSheet);
      root.querySelector('[data-x="save"]').addEventListener('click', () => {
        const title = titleInput.value.trim();
        if (!title) { toast('Please enter a title.'); return; }
        const time = root.querySelector('#f-time').value || null;
        const placeId = activeType !== 'do' ? root.querySelector('#f-place').value : null;
        const recurring = root.querySelector('#f-recurring').checked;

        addItem({ type: activeType, title, time, placeId, recurring });
        closeSheet();
        render();
        toast(`Added to ${activeType.toUpperCase()}`);
      });
    });
  }

  /* ---------------- Main Render Logic ---------------- */

  function updateNavActive() {
    const route = currentRoute();
    document.querySelectorAll('[data-route]').forEach((a) => {
      a.classList.toggle('active', a.dataset.route === route);
    });
  }

  function render() {
    ensureDailyReset();
    applyLeavingClass();
    updateNavActive();

    const route = currentRoute();
    const app = document.getElementById('app');
    const fab = document.getElementById('fab');

    // Wire global FAB click handler
    fab.onclick = () => openQuickAddSheet('do');

    if (route === '/') renderToday(app);
    else if (route === '/history') renderVault(app);
    else if (route === '/places') renderPlaces(app);
    else if (route === '/settings') renderSettings(app);
    else renderToday(app);
  }

  /* ---------------- Today View Renderer ---------------- */

  function renderToday(app) {
    const now = new Date();
    const cp = currentPlace();
    const leaving = !!state.leavingPlaceId;
    const leavingPlace = leaving ? placeById(state.leavingPlaceId) : null;

    const openItems = state.items.filter((i) => !i.done);
    const doItems = openItems.filter((i) => i.type === 'do');
    const takeItems = openItems.filter((i) => i.type === 'take' && (!leaving || i.placeId === state.leavingPlaceId));
    const giveItems = openItems.filter((i) => i.type === 'give' && (!leaving || i.placeId === state.leavingPlaceId));

    const pendingForCurrent = cp
      ? openItems.filter((i) => (i.type === 'take' || i.type === 'give') && i.placeId === cp.id).length
      : 0;

    let locNote;
    if (leaving) {
      const n = takeItems.length + giveItems.length;
      locNote = n === 0 ? 'Clear to go — nothing left at this door.' : `${n} item${n === 1 ? '' : 's'} left before you go.`;
    } else {
      locNote = pendingForCurrent === 0 ? 'Nothing waiting at this door.' : `${pendingForCurrent} item${pendingForCurrent === 1 ? '' : 's'} waiting for when you leave.`;
    }

    app.innerHTML = `
      <div class="today-head">
        <div>
          <div class="today-date">${esc(dateHeading(now))}</div>
          <div class="today-greet">${state.settings.name ? `${greeting(now)}, ${esc(state.settings.name)}` : greeting(now)}</div>
        </div>
        <div class="today-clock">${formatClock(now)}</div>
      </div>

      <div class="loc-card">
        <div class="loc-left">
          <div class="loc-icon">${iconSvg(cp ? cp.icon : 'other')}</div>
          <div>
            <div class="loc-label">${leaving ? 'Leaving' : 'Now'}</div>
            <div class="loc-name">${leaving ? `Leaving ${esc(leavingPlace?.name || '')}` : `At ${esc(cp ? cp.name : 'No location set')}`}</div>
          </div>
        </div>
        ${cp ? `<button class="btn ${leaving ? 'btn-ghost' : 'btn-primary'}" data-action="toggle-leaving">${leaving ? 'Arrived / Cancel' : `Leaving ${esc(cp.name)}`}</button>` : `<a href="#/places" data-nav class="btn btn-primary">Add a place</a>`}
        <div class="loc-note">${esc(locNote)}</div>
      </div>

      <div class="columns">
        <section class="col ${leaving ? 'col-hidden' : ''}">
          <div class="col-head"><span class="col-title">Do</span><span class="col-count">${doItems.length} open</span></div>
          <div class="col-list">${doItems.length ? doItems.map(itemRow).join('') : '<p class="col-empty">Nothing here.</p>'}</div>
          <button class="add-link" data-action="add" data-type="do">${PLUS_SVG} Add do</button>
        </section>
        <section class="col">
          <div class="col-head"><span class="col-title">Take</span><span class="col-count">${takeItems.length} open</span></div>
          <div class="col-list">${takeItems.length ? takeItems.map(itemRow).join('') : '<p class="col-empty">Nothing here.</p>'}</div>
          <button class="add-link" data-action="add" data-type="take">${PLUS_SVG} Add take</button>
        </section>
        <section class="col">
          <div class="col-head"><span class="col-title">Give</span><span class="col-count">${giveItems.length} open</span></div>
          <div class="col-list">${giveItems.length ? giveItems.map(itemRow).join('') : '<p class="col-empty">Nothing here.</p>'}</div>
          <button class="add-link" data-action="add" data-type="give">${PLUS_SVG} Add give</button>
        </section>
      </div>
    `;

    wireToday(app);
  }

  function itemRow(it) {
    const place = it.placeId ? placeById(it.placeId) : null;
    const bits = [];
    if (it.time) bits.push(`<span>${esc(formatTime12(it.time))}</span>`);
    if (place) bits.push(`<span class="item-tag">${esc(place.name)}</span>`);
    if (it.recurring) bits.push(`<span class="item-tag">Routine</span>`);

    return `
      <div class="item" data-id="${it.id}">
        <button class="item-check" data-action="complete" data-id="${it.id}" aria-label="Mark done">${CHECK_SVG}</button>
        <div class="item-body">
          <p class="item-title">${esc(it.title)}</p>
          <p class="item-meta">${bits.join('')}</p>
        </div>
        <button class="item-menu" data-action="item-menu" data-id="${it.id}">⋯</button>
      </div>`;
  }

  function wireToday(app) {
    app.querySelectorAll('[data-action="add"]').forEach((btn) => {
      btn.addEventListener('click', () => openQuickAddSheet(btn.dataset.type));
    });
    app.querySelectorAll('[data-action="complete"]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.item');
        row.classList.add('completing');
        setTimeout(() => { completeItem(btn.dataset.id); render(); }, 180);
      });
    });
    app.querySelectorAll('[data-action="item-menu"]').forEach((btn) => {
      btn.addEventListener('click', () => openItemMenu(btn.dataset.id));
    });
    const leaveBtn = app.querySelector('[data-action="toggle-leaving"]');
    if (leaveBtn) leaveBtn.addEventListener('click', toggleLeaving);
  }

  function openItemMenu(id) {
    const it = state.items.find((i) => i.id === id);
    if (!it) return;
    openSheet(`
      <h3 class="sheet-title">${esc(it.title)}</h3>
      <div class="stack">
        <button class="btn btn-ghost btn-block" data-x="delete">Delete item</button>
      </div>
    `, (root) => {
      root.querySelector('[data-x="delete"]').addEventListener('click', () => {
        deleteItem(id); closeSheet(); render(); toast('Item deleted.');
      });
    });
  }

  /* ---------------- Vault Renderer ---------------- */

  let vaultFilter = 'all';
  let vaultQuery = '';

  function renderVault(app) {
    const q = vaultQuery.trim().toLowerCase();
    let entries = state.vault.filter((v) => vaultFilter === 'all' || v.type === vaultFilter);
    if (q) entries = entries.filter((v) => v.title.toLowerCase().includes(q) || (v.place || '').toLowerCase().includes(q));

    app.innerHTML = `
      <div class="eyebrow">History Vault</div>
      <h1 class="page-title">Completed Log</h1>
      <p class="page-sub">An archive of completed actions and routines so you can verify what you did.</p>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="vault-search" placeholder="Search entries or places" value="${esc(vaultQuery)}" />
      </div>
      <div class="filter-row">
        ${['all', 'do', 'take', 'give'].map((f) => `<button class="chip ${vaultFilter === f ? 'active' : ''}" data-filter="${f}">${f === 'all' ? 'All' : f[0].toUpperCase() + f.slice(1)}</button>`).join('')}
      </div>

      ${entries.length ? renderVaultGroups(entries) : `
        <div class="empty-panel">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="7" width="17" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 7 5.5 3.5h13L20.5 7" stroke="currentColor" stroke-width="1.5"/></svg>
          <p>${q || vaultFilter !== 'all' ? 'No matching entries found.' : 'Vault is empty. Completed tasks will land here.'}</p>
        </div>`}
    `;

    app.querySelector('#vault-search').addEventListener('input', (e) => { vaultQuery = e.target.value; renderVault(app); });
    app.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => { vaultFilter = b.dataset.filter; renderVault(app); }));
  }

  function renderVaultGroups(entries) {
    const groups = new Map();
    entries.forEach((v) => {
      const label = vaultDayLabel(v.timestamp);
      if (!groups.has(label)) groups.set(label, []);
      groups.get(label).push(v);
    });
    let html = '';
    for (const [label, list] of groups) {
      html += `<div class="vault-day">
        <div class="vault-day-label">${esc(label)}</div>
        <div class="vault-list">
          ${list.map((v) => `
            <div class="vault-row">
              <div class="vault-check">${CHECK_SVG}</div>
              <div>
                <div class="vault-row-title">${esc(v.title)}</div>
                <div class="vault-row-meta">${v.type.toUpperCase()}${v.place ? ' · ' + esc(v.place) : ''}</div>
              </div>
              <div class="vault-row-time">${esc(formatClock(new Date(v.timestamp)))}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }
    return html;
  }

  /* ---------------- Places Renderer ---------------- */

  function renderPlaces(app) {
    app.innerHTML = `
      <div class="eyebrow">Location Thresholds</div>
      <div class="row-between" style="align-items:flex-start; margin-bottom:8px;">
        <div>
          <h1 class="page-title" style="margin-bottom:6px;">Places</h1>
          <p class="page-sub" style="margin-bottom:22px;">Organize actions around physical locations and bases.</p>
        </div>
        <button class="btn btn-primary" data-action="add-place">+ Add Place</button>
      </div>
      <div id="place-list">
        ${state.places.map(placeRow).join('') || '<p class="col-empty">No places configured yet.</p>'}
      </div>
    `;

    app.querySelector('[data-action="add-place"]').addEventListener('click', () => openAddPlaceSheet());
    app.querySelectorAll('[data-action="edit-place"]').forEach((b) => b.addEventListener('click', () => openAddPlaceSheet(placeById(b.dataset.id))));
    app.querySelectorAll('[data-action="use-place"]').forEach((b) => b.addEventListener('click', () => { setCurrentPlace(b.dataset.id); render(); toast('Active place updated.'); }));
  }

  function placeRow(p) {
    const sub = [p.isCurrent ? 'Active Base' : null, p.lat != null ? 'Location Pinned' : 'No Pin'].filter(Boolean).join(' · ');
    return `
      <div class="place-row">
        <div class="place-left">
          <div class="place-icon">${iconSvg(p.icon)}</div>
          <div>
            <div class="place-name">${esc(p.name)}</div>
            <div class="place-sub">${esc(sub)}</div>
          </div>
        </div>
        <div class="place-actions">
          ${!p.isCurrent ? `<button class="btn btn-ghost btn-sm" data-action="use-place" data-id="${p.id}">Set Active</button>` : ''}
          <button class="btn btn-ghost btn-sm" data-action="edit-place" data-id="${p.id}">Edit</button>
        </div>
      </div>`;
  }

  function openAddPlaceSheet(editing) {
    const isEdit = editing && editing.id;
    openSheet(`
      <h3 class="sheet-title">${isEdit ? 'Edit Place' : 'Add Place'}</h3>
      <div class="sheet-row">
        <div class="field-label">Name</div>
        <input class="text-input" id="p-name" placeholder="e.g. Office, Gym" value="${isEdit ? esc(editing.name) : ''}" />
      </div>
      <div class="sheet-row">
        <div class="field-label">Icon</div>
        <div class="seg" id="p-icon-seg">
          ${Object.keys(ICONS).map((k) => `<button type="button" data-icon="${k}" class="${(isEdit ? editing.icon : 'home') === k ? 'active' : ''}">${ICON_LABELS[k]}</button>`).join('')}
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" data-x="cancel">Cancel</button>
        ${isEdit ? '<button class="btn btn-danger" data-x="delete">Delete</button>' : ''}
        <button class="btn btn-primary" data-x="save">Save</button>
      </div>
    `, (root) => {
      let icon = isEdit ? editing.icon : 'home';
      root.querySelector('#p-name').focus();
      
      root.querySelectorAll('#p-icon-seg button').forEach((b) => b.addEventListener('click', () => {
        icon = b.dataset.icon;
        root.querySelectorAll('#p-icon-seg button').forEach((x) => x.classList.toggle('active', x === b));
      }));

      root.querySelector('[data-x="cancel"]').addEventListener('click', closeSheet);
      const delBtn = root.querySelector('[data-x="delete"]');
      if (delBtn) delBtn.addEventListener('click', () => { deletePlace(editing.id); closeSheet(); render(); toast('Place removed.'); });
      
      root.querySelector('[data-x="save"]').addEventListener('click', () => {
        const name = root.querySelector('#p-name').value.trim();
        if (!name) { toast('Please enter a place name.'); return; }
        if (isEdit) updatePlace(editing.id, { name, icon });
        else addPlace({ name, icon });
        closeSheet();
        render();
      });
    });
  }

  /* ---------------- Settings Renderer ---------------- */

  function renderSettings(app) {
    const s = state.settings;
    app.innerHTML = `
      <div class="eyebrow">Preferences</div>
      <h1 class="page-title">Settings</h1>

      <div class="section-card">
        <h2 class="section-title">Profile</h2>
        <div class="field-label">Your Name</div>
        <input class="text-input" id="s-name" placeholder="e.g. Alex" value="${esc(s.name)}" />
      </div>

      <div class="section-card">
        <h2 class="section-title">Device Feedback</h2>
        <div class="toggle-row">
          <div class="toggle-copy"><strong>Haptics</strong><span>Vibrate slightly when ticking off items.</span></div>
          <button class="switch ${s.permHaptics ? 'on' : ''}" id="s-hap" role="switch" aria-checked="${s.permHaptics}"></button>
        </div>
      </div>

      <div class="section-card">
        <h2 class="section-title">Day Management</h2>
        <p class="section-sub">Daily reset happens automatically at midnight.</p>
        <div class="stack">
          <button class="btn btn-ghost btn-block" id="s-sample-day">Load Sample Tasks</button>
        </div>
      </div>

      <div class="section-card">
        <h2 class="section-title">Storage</h2>
        <p class="section-sub">All data is stored locally in your web browser.</p>
        <button class="btn btn-danger" id="s-clear">Clear All Data</button>
      </div>

      <p class="footer-tag">Threshold · Routine & Task Companion</p>
    `;

    app.querySelector('#s-name').addEventListener('change', (e) => { state.settings.name = e.target.value.trim(); saveState(); });
    app.querySelector('#s-hap').addEventListener('click', () => {
      state.settings.permHaptics = !state.settings.permHaptics;
      saveState();
      renderSettings(app);
      if (state.settings.permHaptics) doHaptic();
    });
    app.querySelector('#s-sample-day').addEventListener('click', () => { loadSampleDay(); render(); toast('Sample tasks loaded.'); });
    app.querySelector('#s-clear').addEventListener('click', () => {
      openSheet(`
        <h3 class="sheet-title">Clear all data?</h3>
        <p class="page-sub">This removes all tasks, places, and history. This action cannot be undone.</p>
        <div class="sheet-actions">
          <button class="btn btn-ghost" data-x="cancel">Cancel</button>
          <button class="btn btn-danger" data-x="confirm">Clear Everything</button>
        </div>
      `, (root) => {
        root.querySelector('[data-x="cancel"]').addEventListener('click', closeSheet);
        root.querySelector('[data-x="confirm"]').addEventListener('click', () => {
          localStorage.removeItem(STORE_KEY);
          state = defaultState();
          closeSheet();
          navigate('/');
          render();
          toast('Data cleared.');
        });
      });
    });
  }

  function loadSampleDay() {
    if (!state.places.length) {
      state.places.push({ id: uid(), name: 'Home', icon: 'home', lat: null, lng: null, isCurrent: true });
    }
    const home = state.places.find((p) => p.isCurrent) || state.places[0];
    let office = state.places.find((p) => p.name.toLowerCase() === 'office');
    if (!office) { office = { id: uid(), name: 'Office', icon: 'office', lat: null, lng: null, isCurrent: false }; state.places.push(office); }

    addItem({ type: 'do', title: 'Review morning schedule', time: '09:00', recurring: true });
    addItem({ type: 'take', title: 'Laptop charger', placeId: home.id, recurring: false });
    addItem({ type: 'take', title: 'Water bottle & keys', placeId: home.id, recurring: true });
    addItem({ type: 'give', title: 'Hand documents to team', placeId: office.id, recurring: false });
  }

  /* ---------------- Initialization ---------------- */

  function boot() {
    ensureDailyReset();
    saveState();
    applyLeavingClass();
    render();

    setInterval(() => {
      ensureDailyReset();
      if (currentRoute() === '/') render();
    }, 30000);
  }

  // Ensure app initializes even if DOMContentLoaded has already fired on static hosting
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
